[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panoptic-10v3"
version = "0.1.0"
description = "RGB-only 10-view versus 3-view human skeleton reconstruction on CMU Panoptic"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.23,<2",
  "scipy>=1.9",
  "opencv-python>=4.8",
  "matplotlib>=3.6",
  "PyYAML>=6",
]

[project.optional-dependencies]
vitpose = [
  "torch>=2.0",
  "openmim>=0.3.9",
]
hf-vitpose = [
  "torch>=2.0",
  "torchvision>=0.15",
  "transformers>=4.48",
  "Pillow>=10",
]
dev = ["pytest>=7"]

[project.scripts]
panoptic-10v3 = "panoptic_10v3.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
