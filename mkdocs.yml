site_name: Radar Human Activity Dataset Notes
site_description: Literature notes and metric references for radar/RF human sensing and pose estimation.
docs_dir: docs
site_dir: site

theme:
  name: readthedocs
  highlightjs: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Dataset Links: radar_human_activity_sensing_papers.md
  - Papers by Impact: radar_human_sensing_papers_by_impact.md
  - Accuracy Summary: selected_work_accuracy.md
  - Model Architecture Comparison: model_architecture_comparison.md
  - Pose Metrics Reference: human_pose_metrics_reference.md
  - Three-ZED-X Human Mesh Roadmap: zedx_multiview_human_mesh_roadmap.md
  - CMU Panoptic 10-vs-3 Camera Study: cmu_panoptic_10_vs_3_camera_study.md

markdown_extensions:
  - admonition
  - fenced_code
  - tables
  - toc:
      permalink: true
  - sane_lists

strict: true
